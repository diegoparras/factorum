name: CI y publicación (GHCR)

# Pruebas en cada push y PR. En main, además, publica ghcr.io/<owner>/factorum con los tags
# :latest, :X.Y.Z (del CHANGELOG) y :sha, y crea el Release vX.Y.Z con las notas de esa versión.
# Sin sección en el CHANGELOG no hay versión. Usa el GITHUB_TOKEN del runner: sin tokens manuales.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: factorum, POSTGRES_PASSWORD: factorum, POSTGRES_DB: factorum_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factorum" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - run: test -z "$(gofmt -l . | grep -v '^.claude/')"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          FACTORUM_TEST_DB: postgres://factorum:factorum@localhost:5432/factorum_test?sslmode=disable

  publicar:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versión y novedades (CHANGELOG)
        id: ver
        run: |
          V="$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          test -n "$V" || { echo "::error::El CHANGELOG no tiene una sección ## [X.Y.Z]"; exit 1; }
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          { echo "## Factorum v$V"; echo; cat "$RUNNER_TEMP/notas.md"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/factorum
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release de la versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subió la versión ni sumó novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Factorum v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
